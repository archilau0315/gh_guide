<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grasshopper 2 组件速查手册</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">GH²</span>
    <span class="brand-text">
      <b>Grasshopper 2</b> 组件速查手册
      <small>Rhino 9 · 1416 组件 · 中英对照</small>
    </span>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜索组件名、端口、描述...">
    <span id="search-count" class="search-count"></span>
  </div>
  <button id="theme-toggle" class="theme-toggle" title="切换主题">◐</button>
</header>

<!-- 主体 -->
<main class="layout">

  <!-- 左侧分类导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">分类</span>
      <span class="sidebar-count" id="sidebar-count"></span>
    </div>
    <nav id="category-nav"></nav>
    <div class="sidebar-footer">
      <a href="https://www.rhino3d.com/docs/grasshopper2/" target="_blank">官方文档 ↗</a>
      <a href="https://github.com/archilau0315" target="_blank">GitHub ↗</a>
    </div>
  </aside>

  <!-- 中间卡片网格 -->
  <section class="content">
    <div class="content-header">
      <h1 id="content-title">全部组件</h1>
      <span id="content-count" class="content-count"></span>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">🔍</div>
      <div class="empty-text">没找到匹配的组件</div>
    </div>
  </section>

</main>

<!-- 详情弹窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<!-- 加载状态 -->
<div id="loading" class="loading">
  <div class="loading-spinner"></div>
  <div>加载 1416 个组件...</div>
</div>

<script src="app.js"></script>
</body>
</html>
