<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grasshopper 2 组件速查手册</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">GH²</span>
    <span class="brand-text">
      <b>Grasshopper 2</b> 组件速查手册
      <small>Rhino 9 · 1416 组件 · 中英对照</small>
    </span>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜索组件名、端口、描述...">
    <span id="search-count" class="search-count"></span>
  </div>
  <button id="theme-toggle" class="theme-toggle" title="切换主题">◐</button>
</header>

<!-- 主体 -->
<main class="layout">

  <!-- 左侧分类导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">分类</span>
      <span class="sidebar-count" id="sidebar-count"></span>
    </div>
    <nav id="category-nav"></nav>
    <div class="sidebar-footer">
      <a href="https://www.rhino3d.com/docs/grasshopper2/" target="_blank" rel="noopener">官方文档 ↗</a>
      <div class="sidebar-social">
        <a href="https://github.com/archilau0315/gh_guide" target="_blank" rel="noopener" title="GitHub 仓库" aria-label="GitHub 仓库">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <a href="https://gitee.com/archilau/gh_guide" target="_blank" rel="noopener" title="Gitee 仓库（国内镜像）" aria-label="Gitee 仓库">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <rect width="24" height="24" rx="5" fill="#C71D23"/>
            <g transform="translate(4,4)">
              <path fill="#fff" d="M13.6 7.3H7.2a.62.62 0 0 0-.62.62v1.9c0 .35.28.62.62.62h3.44c-.4 1.1-1.5 1.87-2.83 1.87-1.86 0-3.36-1.5-3.36-3.36S5.95 5.6 7.81 5.6h5.79V3.7H7.81A5.26 5.26 0 0 0 2.55 8.96 5.26 5.26 0 0 0 7.81 14.2c2.9 0 5.26-2.36 5.26-5.24V8.54c0-.68.28-1.24.53-1.24z"/>
            </g>
          </svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- 中间卡片网格 -->
  <section class="content">
    <div class="content-header">
      <h1 id="content-title">全部组件</h1>
      <span id="content-count" class="content-count"></span>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">🔍</div>
      <div class="empty-text">没找到匹配的组件</div>
    </div>
  </section>

</main>

<!-- 详情弹窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<!-- 加载状态 -->
<div id="loading" class="loading">
  <div class="loading-spinner"></div>
  <div>加载 1416 个组件...</div>
</div>

<script src="app.js"></script>
</body>
</html>
